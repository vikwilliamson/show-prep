name: Delete Neon Preview Branch on PR Close

# Vercel's native Neon integration (Preview-scoped, see
# lib/vercel-db-scoping.ts) creates a Neon branch named `preview/<git-branch>`
# for every Preview deployment — that's the branch Preview builds actually
# read DATABASE_URL from. Vercel only deletes it once the *deployment* is
# removed, and Vercel's default retention for preview deployments is 180
# days, so in practice these branches never get cleaned up on their own and
# silently accumulate against Neon's per-project branch cap.
#
# This workflow does not create a branch — Vercel already does that. It
# only deletes the Vercel-managed branch on PR close, which is Neon's own
# documented recommendation for this exact situation, and is safe to run
# alongside Vercel's eventual (much slower) cleanup: if this deletes the
# branch first, Vercel's cleanup later just finds it already gone.
#
# (An earlier version of this workflow also created a second,
# differently-named branch itself. That branch was never consumed by
# anything in this repo and only doubled the branch count, so it's been
# removed rather than fixed.)

on:
  pull_request:
    types:
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  setup:
    name: Setup
    outputs:
      branch: ${{ steps.branch_name.outputs.current_branch }}
    runs-on: ubuntu-latest
    steps:
      - name: Get branch name
        id: branch_name
        uses: tj-actions/branch-names@v8

  delete_neon_branch:
    name: Delete Neon Branch
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Delete Neon Branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_BRANCH: preview/${{ needs.setup.outputs.branch }}
        # Runs neonctl directly instead of neondatabase/delete-branch-action
        # (which just shells out to this same CLI, no better error signal
        # of its own) so the blanket `continue-on-error: true` this replaced
        # can be gone: that swallowed every failure mode alike — a PR that
        # never got a Preview deployment (no branch to delete, fine) *and*
        # an expired API key, a wrong project id, a rate limit, or this
        # workflow computing the wrong branch name entirely (VIK-120).
        #
        # neonctl resolves a branch *name* by listing the project's branches
        # and matching (src/utils/enrichers.ts's branchIdResolve, called
        # before any delete API call) — a name with no match throws exactly
        # `Branch <name> not found.\nAvailable branches: ...` and neonctl
        # exits 1. That's the one shape of failure this step treats as
        # non-blocking. Everything else (auth, rate limit, a failure from
        # the delete call itself) stays a hard, red failure.
        run: |
          npm i -g --ignore-scripts neonctl@2.22.0

          set +e
          output=$(neonctl branches delete "$NEON_BRANCH" --project-id "$NEON_PROJECT_ID" 2>&1)
          status=$?
          set -e
          echo "$output"

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          if echo "$output" | grep -qE '^Branch .+ not found\.$'; then
            echo "::warning title=Neon branch already gone::${NEON_BRANCH} wasn't found in project ${NEON_PROJECT_ID} — treating this PR close as having nothing to clean up. If this fires on every close (not just for PRs that never got a Preview deployment), the branch name this workflow computes may not match what Vercel's Neon integration actually creates."
            exit 0
          fi

          echo "::error title=Neon branch delete failed::${NEON_BRANCH} delete failed for a reason other than \"branch not found\" — see the step log above for the real error. This needs a human look: it likely means Neon's branch-cap problem (see this workflow's header comment) is silently recurring again."
          exit "$status"
