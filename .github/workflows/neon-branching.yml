name: Delete Neon Preview Branch on PR Close

# Vercel's native Neon integration (Preview-scoped, see
# lib/vercel-db-scoping.ts) creates a Neon branch named `preview/<git-branch>`
# for every Preview deployment — that's the branch Preview builds actually
# read DATABASE_URL from. Vercel only deletes it once the *deployment* is
# removed, and Vercel's default retention for preview deployments is 180
# days, so in practice these branches never get cleaned up on their own and
# silently accumulate against Neon's per-project branch cap.
#
# This workflow does not create a branch — Vercel already does that. It
# only deletes the Vercel-managed branch on PR close, which is Neon's own
# documented recommendation for this exact situation, and is safe to run
# alongside Vercel's eventual (much slower) cleanup: if this deletes the
# branch first, Vercel's cleanup later just finds it already gone.
#
# (An earlier version of this workflow also created a second,
# differently-named branch itself. That branch was never consumed by
# anything in this repo and only doubled the branch count, so it's been
# removed rather than fixed.)

on:
  pull_request:
    types:
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  setup:
    name: Setup
    outputs:
      branch: ${{ steps.branch_name.outputs.current_branch }}
    runs-on: ubuntu-latest
    steps:
      - name: Get branch name
        id: branch_name
        uses: tj-actions/branch-names@v8

  delete_neon_branch:
    name: Delete Neon Branch
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon Branch
        uses: neondatabase/delete-branch-action@v3
        # A PR that never got a Vercel Preview deployment (e.g. closed
        # immediately, no commits) has no Neon branch to delete — don't let
        # that redden an otherwise-unrelated PR-closed signal.
        continue-on-error: true
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/${{ needs.setup.outputs.branch }}
          api_key: ${{ secrets.NEON_API_KEY }}
