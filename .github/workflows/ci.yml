name: CI

on:
  pull_request:
    branches: [main, v3-generalized]
  push:
    branches: [main, v3-generalized]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: TDD pairing check
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          bash scripts/check-tdd-pairing.sh --range origin/${{ github.base_ref }}...HEAD

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Mobile lint
        run: pnpm --filter gamma-companion lint

      - name: Mobile typecheck
        run: pnpm --filter gamma-companion typecheck

      - name: Mobile unit tests
        run: pnpm --filter gamma-companion test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: E2E tests
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'e2e-ci-session-secret-do-not-use-in-prod' }}
        run: pnpm test:e2e
